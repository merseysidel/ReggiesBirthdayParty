<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reggie's 4th Birthday Party</title>
<meta name="description" content="მოწვევა რეჯის დაბადების დღეზე — 27 დეკემბერი, 17:00, ასკინკილა">
<meta property="og:title" content="Reggie's 4th Birthday Party 🎄">
<meta property="og:description" content="27 დეკემბერი, 17:00 · ასკინკილა">
<meta name="theme-color" content="#dfe8cf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@800&family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>

  <!-- ქაღალდის გირლიანდები და ლენტები -->
  <div class="garland" aria-hidden="true"></div>
  <!-- ოქროსფერი ვარსკვლავები -->
  <div class="sparkles" aria-hidden="true"></div>
  <!-- თოვლი -->
  <div class="snow" aria-hidden="true"></div>

  <main>
    <!-- 1. HERO -->
    <header class="hero">
      <div class="balloons" aria-hidden="true">
        <span class="balloon b1"></span><span class="balloon b2"></span><span class="balloon b3"></span>
      </div>
      <h1 class="kid-title" aria-label="Reggie's 4th Birthday Party">Reggie's <span class="four">4</span><sup>th</sup><br>Birthday Party</h1>
    </header>

    <!-- 2. რეჯის ფოტო (დროებითი) -->
    <section class="photo-wrap">
      <span class="deco deco-f1" data-v="f1" style="--body:#c8102e;--accent:#fff"></span>
      <span class="deco deco-nascar" data-v="nascar"></span>
      <span class="deco deco-tractor" data-v="tractor"></span>
      <span class="deco deco-f1b" data-v="f1" style="--body:#0f6b3a;--accent:#f5c542"></span>
      <figure class="polaroid">
        <img src="reggie.jpg?v=12" alt="რეჯი">
      </figure>
    </section>

    <!-- 3. სად და როდის -->
    <section class="card" id="details">
      <h2>📍 სად და როდის</h2>
      <ul class="details">
        <li><span>თარიღი</span><strong>27 დეკემბერი, კვირა</strong></li>
        <li><span>დრო</span><strong>17:00</strong></li>
        <li><span>ადგილი</span><strong>ასკინკილა</strong></li>
      </ul>
      <div class="btn-row">
        <a class="btn" href="https://share.google/vkcr5yQjkVueylVBz" target="_blank" rel="noopener">📍 რუკაზე ნახვა</a>
        <a class="btn btn-ghost" href="https://www.facebook.com/askinkila/?locale=ka_GE" target="_blank" rel="noopener">Facebook</a>
        <a class="btn btn-ghost" href="https://www.instagram.com/askinkila_kids" target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>

    <!-- 4. Countdown -->
    <section class="card" id="countdown-section">
      <h2>⏳ დაბადების დღემდე დარჩენილია</h2>
      <div class="countdown" id="countdown">
        <div><b id="cd-days">0</b><span>დღე</span></div>
        <div><b id="cd-hours">0</b><span>საათი</span></div>
        <div><b id="cd-mins">0</b><span>წუთი</span></div>
        <div><b id="cd-secs">0</b><span>წამი</span></div>
      </div>
    </section>

    <!-- მანქანა ნაძვის ხით -->
    <div class="lane" aria-hidden="true"><span class="tree-car"></span></div>

    <!-- 5. დრეს კოდი -->
    <section class="card" id="dresscode">
      <h2>🎅 დრეს კოდი</h2>
      <p class="dress">საახალწლო / საშობაო</p>
    </section>

    <!-- ფოტოების გალერეა — დამალულია -->
    <section class="card" id="gallery" hidden>
      <h2>📸 რეჯი</h2>
      <div class="gallery"></div>
    </section>

    <!-- 6. RSVP -->
    <section class="card" id="rsvp">
      <h2>✉️ მოსვლის დადასტურება</h2>
      <form id="rsvp-form" novalidate>
        <label for="guest-name">შენი სახელი</label>
        <input id="guest-name" name="name" type="text" placeholder="მაგ: ნინო" required autocomplete="name">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
        <div class="btn-row">
          <button type="submit" class="btn" data-answer="yes">✅ მოვდივარ</button>
          <button type="submit" class="btn btn-ghost" data-answer="no">❌ ვერ მოვდივარ</button>
        </div>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
    </section>

    <footer>გელოდებით! 🎁🎄🎂</footer>
  </main>

<script src="script.js?v=12"></script>
</body>
</html>
